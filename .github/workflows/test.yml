name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  SKILL_DIR: jev-triage/skills/jev-triage

jobs:
  manifests:
    # A malformed manifest breaks installation for everyone; check it first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and version agreement
        run: |
          python3 - <<'PY'
          import json
          paths = [
            ".claude-plugin/marketplace.json",
            ".agents/plugins/marketplace.json",
            "jev-triage/.claude-plugin/plugin.json",
            "jev-triage/.codex-plugin/plugin.json",
            "clean-code/.claude-plugin/plugin.json",
            "clean-code/.codex-plugin/plugin.json",
          ]
          docs = {}
          for p in paths:
              docs[p] = json.load(open(p))
              print("ok", p)
          claude_entries = {p["name"]: p for p in docs[".claude-plugin/marketplace.json"]["plugins"]}
          codex_entries = {p["name"]: p for p in docs[".agents/plugins/marketplace.json"]["plugins"]}
          for name in ("jev-triage", "clean-code"):
              pj = docs[f"{name}/.claude-plugin/plugin.json"]
              cj = docs[f"{name}/.codex-plugin/plugin.json"]
              assert name in claude_entries and name in codex_entries, f"{name} missing from catalog"
              assert pj["name"] == cj["name"] == claude_entries[name]["name"], "plugin names disagree"
              assert pj["version"] == cj["version"] == claude_entries[name]["version"], "versions disagree"
              print("name/version agreement:", pj["name"], pj["version"])
          PY

  offline:
    # No key, no network, no install - the suite that must always be green.
    runs-on: ubuntu-latest
    needs: manifests
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node "$SKILL_DIR/test/offline.mjs"

  live:
    # Skips itself (exit 0) when the secret is absent, so forks stay green.
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node "$SKILL_DIR/test/live.mjs"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
